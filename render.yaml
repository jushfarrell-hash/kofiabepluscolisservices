services:
  - type: web
    name: kofiabe-plus-colis-services
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: colis-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false